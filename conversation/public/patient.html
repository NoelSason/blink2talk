<!doctype html>
<meta charset="utf-8">
<title>BlinkVoice: patient</title>
<style>
  :root { --hi: #ffd84d; }
  body { font: 28px system-ui; margin: 0; background: #111; color: #eee; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; font-size: 18px; color: #aaa; }
  #state { font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .05em; }
  #heard { padding: 8px 24px 16px; min-height: 1.4em; color: #9cf; }
  #opts { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 0 24px; align-content: start; }
  .opt { background: #222; border: 4px solid #333; border-radius: 16px; padding: 28px 20px; text-align: center; }
  .opt.urgent { background: #3a1414; border-color: #5a2020; }
  .opt.spell { background: #1d1d2a; }
  .opt.sel { border-color: var(--hi); box-shadow: 0 0 0 4px var(--hi); }
  #spellbar { padding: 0 24px 12px; font-size: 36px; min-height: 1.3em; color: var(--hi); }
  footer { padding: 12px 24px; font-size: 16px; color: #777; display: flex; gap: 16px; align-items: center; }
  footer input { flex: 1; font: inherit; padding: 6px; background: #222; color: #eee; border: 1px solid #444; }
  footer button { font: inherit; }
</style>
<header><span>BlinkVoice</span><span id="state">listening</span><span id="voice"></span></header>
<div id="heard"></div>
<div id="spellbar"></div>
<div id="opts"></div>
<footer>
  <span>←/→ move · Space select · hold N to talk · M always-on mic</span>
  <input id="typed" placeholder="Or type what the nurse says, then Enter">
  <button id="mic">🎤 Hold to talk</button>
  <button id="live">Always on</button>
</footer>
<script>
// Input contract for Julien's blink/gaze module: call these instead of the keyboard.
//   window.blinkvoice.select() / .gazeLeft() / .gazeRight() / .setFatigue(0..1)
const $ = (id) => document.getElementById(id);
const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
const ALPHABET = "ETAOINSHRDLUCMWFGYPBVKJXQZ".split(""); // frequency order: fewer moves on average

let cfg = { urgent: [], spellOption: "" };
let state = "listening";          // listening | options | spelling | speaking
let items = [], sel = 0;          // current choices: { label, kind }
let history = [], lastNurse = "", fatigue = 0;
let spelled = "", prefix = "";    // spelling mode
let unaddressed = [];             // replies held back when speech wasn't meant for the patient
let shown = [], noneCount = 0;    // "None of these" flow for the current question
const CAT_LABEL = { pain: "Pain", comfort: "Body / comfort", people: "People", question: "I have a question" };

function setState(s) { state = s; $("state").textContent = s; }

function render() {
  const o = $("opts"); o.innerHTML = "";
  items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = `opt ${it.kind || ""} ${i === sel ? "sel" : ""}`;
    d.textContent = it.label;
    d.onclick = () => { sel = i; select(); };
    o.append(d);
  });
  $("spellbar").textContent = state === "spelling" ? (spelled + prefix + "▍") : "";
}

const urgentItems = () => cfg.urgent.map((u) => ({ label: u, kind: "urgent" }));

// 3 replies + "None of these" (the 2x2 in the real app), urgent options always reachable.
function showOptions(replies) {
  shown.push(...replies);
  items = [
    ...replies.slice(0, 3).map((r) => ({ label: r, kind: "reply" })),
    { label: "None of these", kind: "spell", act: "none" },
    ...urgentItems(),
  ];
  sel = 0; setState("options"); render();
}

// Speculative request started on Cartesia's turn.eager_end; reused if the final transcript matches.
let prefetch = null; // { text, p }
const fetchReplies = (text, extra = {}) => post("/replies", { transcript: text, history, fatigue, ...extra }).then((r) => r.json());

async function nurseSaid(text) {
  if (!text.trim()) return;
  lastNurse = text; $("heard").textContent = `Nurse: “${text}”`;
  shown = []; noneCount = 0;
  const p = prefetch?.text === text ? prefetch.p : fetchReplies(text);
  prefetch = null;
  history.push({ role: "nurse", text });
  setState("thinking"); items = []; render();
  const d = await p;
  if (d.addressed === false) {
    // Room talk ("grab the chart from room 4"): stay quiet, but one blink still gets the replies.
    history.pop(); unaddressed = d.replies;
    $("heard").textContent = `Not for patient: “${text}”`;
    setState("listening");
    items = [{ label: "Reply anyway", kind: "spell", act: "anyway" }, ...urgentItems()];
    sel = 0; render();
    return;
  }
  showOptions(d.replies);
}

// "None of these": 1st re-asks with the rejected replies, 2nd offers four topics, 3rd opens spelling.
async function none() {
  noneCount++;
  if (noneCount === 1) return moreReplies({});
  if (noneCount === 2) return showTopics();
  setState("spelling"); spelled = ""; prefix = ""; spellItems();
}

function showTopics() {
  noneCount = 2;
  $("heard").textContent = "None of those fit. What is it about?";
  items = [...cfg.categories.map((c) => ({ label: CAT_LABEL[c] ?? c, kind: "spell", act: "cat", cat: c })), ...urgentItems()];
  sel = 0; setState("options"); render();
}

async function moreReplies(extra) {
  $("heard").textContent = extra.category ? `Finding replies about ${CAT_LABEL[extra.category].toLowerCase()}…` : "Finding different replies…";
  setState("thinking"); items = []; render();
  // history already ends with the nurse's question, which goes in as the transcript
  const d = await post("/replies", { transcript: lastNurse, history: history.slice(0, -1), fatigue, rejected: shown, ...extra }).then((r) => r.json());
  // Claude timed out: the fallback (Yes / No / more time) would look like nothing happened, so move on.
  if (d.source === "fallback") return extra.category ? (setState("spelling"), spelled = "", prefix = "", spellItems()) : showTopics();
  $("heard").textContent = `Nurse: “${lastNurse}”`;
  showOptions(d.replies);
}

async function speak(text) {
  setState("speaking"); render();
  history.push({ role: "patient", text });
  const r = await post("/speak", { text });
  if (r.status === 204) {
    await new Promise((res) => { const u = new SpeechSynthesisUtterance(text); u.onend = res; speechSynthesis.speak(u); });
  } else if (r.ok) {
    const a = new Audio(URL.createObjectURL(await r.blob()));
    await new Promise((res) => { a.onended = res; a.onerror = res; a.play(); });
  }
  spelled = ""; prefix = ""; setState("listening"); idle();
}

// Between questions: urgent options stay reachable.
function idle() { items = cfg.urgent.map((u) => ({ label: u, kind: "urgent" })); sel = 0; render(); }

// ---- spelling: letters + word completions, scanned with the same move/select ----
async function spellItems() {
  let words = [];
  if (prefix) {
    try { words = (await (await post("/complete", { prefix, sentenceSoFar: spelled, context: lastNurse })).json()).words; } catch {}
  }
  items = [
    ...(spelled || prefix ? [{ label: "✓ Speak it", kind: "reply", act: "speak" }] : []),
    ...words.map((w) => ({ label: w, kind: "reply", act: "word" })),
    ...(prefix ? [{ label: "␣ space", kind: "spell", act: "space" }, { label: "⌫ delete", kind: "spell", act: "del" }] : []),
    ...ALPHABET.map((c) => ({ label: c, act: "letter" })),
    { label: "✕ Back to options", kind: "spell", act: "back" },
    ...cfg.urgent.map((u) => ({ label: u, kind: "urgent" })),
  ];
  sel = 0; render();
}

async function spellSelect(it) {
  if (it.kind === "urgent") return speak(it.label);
  if (it.act === "letter") prefix += it.label.toLowerCase();
  else if (it.act === "word") { spelled += it.label + " "; prefix = ""; }
  else if (it.act === "space") { spelled += prefix + " "; prefix = ""; }
  else if (it.act === "del") prefix = prefix.slice(0, -1);
  else if (it.act === "speak") return speak((spelled + prefix).trim());
  else if (it.act === "back") { spelled = ""; prefix = ""; return nurseSaid(lastNurse || "How are you feeling?"); }
  await spellItems();
}

// ---- input actions ----
function move(d) { if (!items.length || state === "speaking") return; sel = (sel + d + items.length) % items.length; render(); }
function select() {
  const it = items[sel]; if (!it) return;
  if (state === "spelling") return spellSelect(it);
  if (it.act === "anyway") { history.push({ role: "nurse", text: lastNurse }); return showOptions(unaddressed); }
  if (state !== "options" && it.kind !== "urgent") return;
  if (it.act === "none") return none();
  if (it.act === "cat") return moreReplies({ category: it.cat });
  speak(it.label);
}
window.blinkvoice = { select, gazeLeft: () => move(-1), gazeRight: () => move(1), setFatigue: (f) => (fatigue = f) };

document.addEventListener("keydown", (e) => {
  if (e.target === $("typed")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === " ") { e.preventDefault(); select(); }
  else if ((e.key === "n" || e.key === "N") && !e.repeat) micDown();
  else if (e.key === "m" || e.key === "M") toggleLive();
});
document.addEventListener("keyup", (e) => { if (e.key === "n" || e.key === "N") micUp(); });
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") { nurseSaid(e.target.value); e.target.value = ""; e.target.blur(); } });

// ---- nurse mic: Cartesia Ink-2 streaming STT.
// Default is push-to-talk (hold N or the button). "Always on" lets Ink-2's turn detection decide when the
// nurse is done. Both fall back to Chrome Web Speech when there's no Cartesia key.
let mic = null;       // { stop(), ptt } while the mic is on
let pttHeld = false;

function heardNurse(text) {
  text = text.trim(); if (!text) return;
  if (state === "spelling") { $("heard").textContent = `Nurse: “${text}”`; return; } // don't wipe a half-spelled message
  nurseSaid(text);
}

// Float32 mic frames -> 100 ms chunks of 16 kHz pcm_s16le.
const PCM_WORKLET = `class P extends AudioWorkletProcessor {
  constructor() { super(); this.b = new Int16Array(1600); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      const v = Math.max(-1, Math.min(1, ch[i]));
      this.b[this.n++] = v < 0 ? v * 32768 : v * 32767;
      if (this.n === this.b.length) { this.port.postMessage(this.b.buffer.slice(0)); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("pcm16", P);`;

// Tokens last an hour; reuse one so pressing the key doesn't wait on the server.
let tokenCache = null;
async function sttToken() {
  if (tokenCache && tokenCache.exp > Date.now()) return tokenCache.token;
  const r = await fetch("/stt-token");
  if (r.status !== 200) return null;
  tokenCache = { token: (await r.json()).token, exp: Date.now() + 50 * 60e3 };
  return tokenCache.token;
}

async function cartesiaMic(token, ptt) {
  const q = new URLSearchParams({ model: "ink-2", encoding: "pcm_s16le", sample_rate: "16000", cartesia_version: "2026-08-14", access_token: token });
  const ws = new WebSocket(`wss://api.cartesia.ai/stt/turns/websocket?${q}`);
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  const ctx = new AudioContext({ sampleRate: 16000 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([PCM_WORKLET], { type: "text/javascript" })));
  const node = new AudioWorkletNode(ctx, "pcm16");
  const queue = []; // audio captured before the socket opens, so the first words aren't lost
  const flush = () => { while (queue.length) ws.send(queue.shift()); };
  // While the patient's voice is playing, send silence so the mic doesn't transcribe it as the nurse.
  node.port.onmessage = (e) => {
    const buf = state === "speaking" ? new ArrayBuffer(e.data.byteLength) : e.data;
    if (ws.readyState === 1) { flush(); ws.send(buf); } else if (ws.readyState === 0) queue.push(buf);
  };
  ctx.createMediaStreamSource(stream).connect(node);

  let finals = [], current = "", released = false, done = false;
  const said = () => [...finals, current].join(" ").trim();
  const closeAudio = () => { stream.getTracks().forEach((t) => t.stop()); ctx.close().catch(() => {}); };
  const finish = () => {
    if (done) return; done = true; closeAudio(); mic = null; micLabels();
    if (ptt) heardNurse(said());
  };
  // No turn "config" message: Noel found it stops Ink-2 transcribing. Defaults + eager_end prefetch instead.
  ws.onopen = () => {
    flush();
    if (released) ws.send(JSON.stringify({ type: "close" }));
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "turn.update") { current = m.transcript; if (state !== "spelling") $("heard").textContent = `Nurse: “${ptt ? said() : current}”`; }
    else if (m.type === "turn.end") { if (ptt) { finals.push(m.transcript); current = ""; } else heardNurse(m.transcript); }
    else if (m.type === "turn.eager_end" && !ptt && state !== "spelling" && m.transcript.trim()) {
      const text = m.transcript.trim(); prefetch = { text, p: fetchReplies(text) };
    }
    else if (m.type === "turn.resume") prefetch = null;
    else if (m.type === "error") { $("heard").textContent = `Mic error: ${m.message}`; finals = []; current = ""; finish(); }
  };
  ws.onclose = finish;
  const stop = () => {
    released = true; closeAudio();
    // "close" makes Ink transcribe the buffered audio, then hang up; don't wait more than 2 s for it.
    if (ws.readyState === 1) { flush(); ws.send(JSON.stringify({ type: "close" })); }
    setTimeout(() => { finish(); try { ws.close(); } catch {} }, 2000);
  };
  return { stop, ptt };
}

function webSpeechMic(ptt) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("heard").textContent = "Mic needs a Cartesia key or Chrome"; return null; }
  const rec = new SR(); rec.interimResults = true; rec.continuous = ptt; rec.lang = "en-US"; let timer, last = "";
  rec.onresult = (e) => {
    last = [...e.results].map((r) => r[0].transcript).join("");
    $("heard").textContent = `Nurse: “${last}”`;
    if (!ptt) { clearTimeout(timer); timer = setTimeout(() => rec.stop(), 700); } // always-on: 700 ms silence = done
  };
  rec.onerror = (e) => ($("heard").textContent = `Mic error: ${e.error}`);
  rec.onend = () => { mic = null; micLabels(); heardNurse(last); };
  rec.start();
  return { stop: () => rec.stop(), ptt };
}

async function startMic(ptt) {
  let token = null;
  try { token = await sttToken(); } catch {}
  try { mic = token ? await cartesiaMic(token, ptt) : webSpeechMic(ptt); }
  catch (err) { $("heard").textContent = `Mic error: ${err.message}`; mic = webSpeechMic(ptt); }
  micLabels();
  if (ptt && !pttHeld) mic?.stop(); // released before the mic finished starting
}

function micLabels() {
  $("mic").textContent = mic?.ptt ? "🔴 Talking… release to send" : "🎤 Hold to talk";
  $("live").textContent = mic && !mic.ptt ? "🔴 Always on (click to stop)" : "Always on";
}

function micDown() { pttHeld = true; if (!mic) startMic(true); }
function micUp() { pttHeld = false; if (mic?.ptt) mic.stop(); }
function toggleLive() { if (mic) return mic.ptt ? null : mic.stop(); startMic(false); }

$("mic").addEventListener("pointerdown", micDown);
$("mic").addEventListener("pointerup", micUp);
$("mic").addEventListener("pointerleave", () => pttHeld && micUp());
$("live").onclick = toggleLive;
sttToken().catch(() => {}); // warm the token

fetch("/config").then((r) => r.json()).then((c) => {
  cfg = c;
  $("voice").textContent = c.mockVoice ? "browser voice" : c.clonedVoice ? "own voice ✓" : "default voice";
  idle();
});
</script>
